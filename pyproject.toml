[project]
name = "meeting-copilot"
version = "0.0.0"
description = "Turns customer meetings into evidence-backed engineering decisions."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "meeting-copilot-api",
    "meeting-copilot-worker",
    "meeting-copilot-contracts",
]

[tool.uv]
# The root only ties the workspace together; it is not itself an installable package.
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/contracts"]

[tool.uv.sources]
meeting-copilot-api = { workspace = true }
meeting-copilot-worker = { workspace = true }
meeting-copilot-contracts = { workspace = true }

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api/src", "apps/worker/src", "packages/contracts/src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # bugbear
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "SIM",   # simplify
    "RUF",   # ruff-specific
    "ASYNC", # blocking calls inside async code
    "PT",    # pytest style
    "S",     # bandit security checks
    "TID",   # tidy imports (used later to enforce module boundaries)
    "PTH",   # pathlib over os.path
]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest tests are written; tests use fake, throwaway credentials.
"**/tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app", "worker", "contracts", "tests"]

[tool.ruff.format]
line-ending = "lf"
# Code blocks in specs and ADRs are illustrative and laid out for reading; don't reformat them.
exclude = ["*.md"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["apps", "packages", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["apps/api/tests", "apps/worker/tests", "packages/contracts/tests", "tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-m",
    "not stack",
]
markers = [
    "stack: needs the running docker compose stack; run with `pytest -m stack`",
    "integration: starts real containers with Testcontainers (needs Docker)",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.44.6",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.6",
    "testcontainers>=4.15.0",
    "types-pyyaml>=6.0.12.20261113",
]
