# Full local stack. First run:  cp .env.example .env  (then edit), then  docker compose up -d
# Every published port is bound to 127.0.0.1, so nothing is reachable from the network.
name: meeting-copilot

x-app-environment: &app-environment
  APP_PROFILE: ${APP_PROFILE:?set APP_PROFILE in .env}
  APP_DATABASE_URL: &database-url postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  APP_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  APP_STORAGE__ENDPOINT_URL: http://storage:9000
  # Browsers reach storage on the published port; pre-signed URLs are signed for this host.
  APP_STORAGE__PUBLIC_ENDPOINT_URL: http://localhost:9000
  # The app's own user, limited to the bucket (created by storage-init), never the root one.
  APP_STORAGE__ACCESS_KEY: ${STORAGE_APP_ACCESS_KEY}
  APP_STORAGE__SECRET_KEY: ${STORAGE_APP_SECRET_KEY}
  APP_STORAGE__BUCKET: ${STORAGE_BUCKET}

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.8.4-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  storage:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ROOT_USER:?set STORAGE_ROOT_USER in .env}
      RUSTFS_SECRET_KEY: ${STORAGE_ROOT_PASSWORD:?set STORAGE_ROOT_PASSWORD in .env}
      RUSTFS_CONSOLE_ENABLE: "true"
      # S3 API: allow browser uploads via pre-signed URLs from the frontend only.
      RUSTFS_CORS_ALLOWED_ORIGINS: ${WEB_ORIGIN:?set WEB_ORIGIN in .env}
      # The image defaults the console's CORS to "*"; restrict it to the console itself.
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: http://localhost:9001
    volumes:
      - storage-data:/data
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # web console
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # One-shot: creates the private bucket and the app's own storage user, then exits.
  # Safe to re-run. The only service besides storage that receives the root credentials.
  storage-init:
    image: rustfs/rustfs:1.0.6 # same image as storage, for its `rc` admin client
    depends_on:
      storage:
        condition: service_healthy
    environment:
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET in .env}
      STORAGE_ROOT_USER: ${STORAGE_ROOT_USER}
      STORAGE_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD}
      STORAGE_APP_ACCESS_KEY: ${STORAGE_APP_ACCESS_KEY:?set STORAGE_APP_ACCESS_KEY in .env}
      STORAGE_APP_SECRET_KEY: ${STORAGE_APP_SECRET_KEY:?set STORAGE_APP_SECRET_KEY in .env}
      HOME: /tmp # rc saves the root login under $$HOME: keep it in memory, not on disk
    tmpfs:
      - /tmp
    volumes:
      - ./infra/storage:/init:ro
    entrypoint: ["sh", "/init/init.sh"]
    restart: "no"

  # One-shot: applies database migrations, then exits. api and worker start only after it.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
    environment:
      APP_DATABASE_URL: *database-url # only the database URL, none of the other secrets
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "worker.heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  storage-data:
