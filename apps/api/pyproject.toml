[project]
name = "meeting-copilot-api"
version = "0.0.0"
description = "HTTP API: the modular monolith (meetings, transcripts, review, jobs, auth)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "boto3>=1.44.6",
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
