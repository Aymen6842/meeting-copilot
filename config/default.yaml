# Base configuration. A profile (config/profiles/$APP_PROFILE.yaml) overrides it, and
# environment variables (APP_ prefix, "__" for nesting, e.g. APP_TRANSCRIPTION__MODEL)
# override both. Secrets (database, Redis, storage credentials) come only from the environment.

database:
  pool_size: 5
  max_overflow: 5
  pool_timeout_seconds: 10 # wait this long for a free connection before failing

storage:                   # endpoint, credentials and bucket come from the environment
  upload_url_ttl_seconds: 900    # pre-signed PUT for the browser upload
  download_url_ttl_seconds: 300  # pre-signed GET for playback and download

auth:
  session_ttl_hours: 168     # 7 days; the session is deleted at logout
  cookie_name: session
  cookie_secure: true        # browsers still accept Secure cookies on http://localhost
  login_limit_per_email:     # every attempt counts, successful or not
    attempts: 10
    window_seconds: 900
  login_limit_per_ip:
    attempts: 30
    window_seconds: 900
  register_limit_per_ip:
    attempts: 10
    window_seconds: 3600

meetings:
  max_upload_bytes: 4294967296  # 4 GiB; one pre-signed upload can never exceed 5 GiB
  max_duration_ms: 10800000     # 3 hours (spec); checked again by the probe job

transcription:
  provider: local        # local | hosted | fake | cached
  model: large-v3-turbo
  compute_type: int8       # float16 | int8 | int8_float16 | float32
  device: cuda             # cuda | cpu
  language_hint: auto      # auto | en | fr | ar-tn | mixed

diarization:
  enabled: true
  min_speakers: null
  max_speakers: null

uncertainty:
  word_threshold: 0.45
  segment_threshold: 0.6

worker:
  gpu_concurrency: 1
  chunk_seconds: 600
  max_attempts: 3

logging:
  level: INFO              # DEBUG | INFO | WARNING | ERROR

health:
  check_timeout_ms: 2000   # per dependency checked by GET /health
